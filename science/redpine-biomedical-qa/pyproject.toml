[project]
name = "redpine-biomedical-qa"
version = "0.1.0"
description = "Expert-validated biomedical questions, two arms, Claude Opus 5: the runner behind Redpine Biomedical QA"
requires-python = ">=3.11"
dependencies = ["harness", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
bedrock = ["harness[bedrock]"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
