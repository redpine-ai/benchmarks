[project]
name = "harness"
version = "0.1.0"
description = "The tool-use harness the answer-quality tracks run on: config, clients, renderers, agent loop, runner"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.39.0", "botocore[crt]>=1.39.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
